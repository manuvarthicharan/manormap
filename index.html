<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Real Estate Discovery Radar</title>
    <!-- Canonical Host Safeguard: automatically redirect preview hashes to permanent workers.dev origin while preserving auth hash -->
    <script>
      (function() {
        try {
          var h = window.location.hostname;
          if (h.indexOf('-manormap.mkcharan77.workers.dev') !== -1) {
            var target = 'https://manormap.mkcharan77.workers.dev' + window.location.pathname + window.location.search + window.location.hash;
            window.location.replace(target);
          }
        } catch (_) {}
      })();
    </script>
    <!-- Google Maps JavaScript API with places, geometry, visualization (Heatmap), and drawing libraries -->
    <script id="google-maps-script" async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDyPRhU72VW3Ncpiq-9sjWOMB203WYcqoI&libraries=places,geometry,visualization,drawing"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="overflow-hidden m-0 p-0 bg-slate-900 antialiased font-['Plus_Jakarta_Sans','Inter',sans-serif]">
    <div id="root" class="w-full h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
